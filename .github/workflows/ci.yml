name: CI

# Every package in this repo: typecheck, test (where a package has tests) and build, on every push
# and pull request. The package list is discovered from git, so a new house is covered the day its
# package.json is committed — there is no list here to keep up to date.
#
# Builds run with no secrets and no database on purpose: every web degrades to its empty state and
# every api to its seed content when its dependencies are missing (ARCHITECTURE.md, rule 5), so a
# green build here is the same build a fresh deployment produces before its env is filled in.
#
# accounts/ has its own workflow (accounts-ci.yml) and its own repository; hifz/ and zakat/ are
# separate repositories too. None of them are tracked here, so discovery never picks them up.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          pkgs=$(git ls-files '*/package.json' '*/*/package.json' \
            | xargs -n1 dirname \
            | while read -r d; do [ -f "$d/package-lock.json" ] && echo "$d"; done \
            | jq -R . | jq -sc .)
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "$pkgs" | jq .

  check:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.discover.outputs.packages) }}
    name: ${{ matrix.pkg }}
    services:
      # Packages whose tests also run against a real MongoDB; an empty image skips the service.
      mongo:
        image: ${{ contains(fromJson('["cms/api","errors/api","analytics/api"]'), matrix.pkg) && 'mongo:7' || '' }}
        ports: ["27099:27017"]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json
      - run: npm ci
      - run: npm run --if-present typecheck
      - run: npm run --if-present test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27099
      - run: npm run --if-present build

  preflight:
    # The repo-level launch checks that don't need a running stack: placeholder content,
    # sitemap coverage, env examples. See scripts/preflight.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/preflight.mjs --static

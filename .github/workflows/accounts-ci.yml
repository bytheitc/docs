name: accounts CI

# Scoped to the one house this covers — there's no CI anywhere else in this repo yet (see
# ROADMAP.md, "CI across fourteen packages"), and these three packages shouldn't wait on that
# getting resolved for every house at once.
on:
  push:
    paths:
      - "accounts/**"
      - ".github/workflows/accounts-ci.yml"
  pull_request:
    paths:
      - "accounts/**"
      - ".github/workflows/accounts-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accounts/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accounts/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No MONGODB_URI, CMS_SPACE_KEY, etc. here on purpose: every page and route this builds
      # degrades to a 503/placeholder rather than crashing when accounts/api isn't reachable
      # (ARCHITECTURE.md, rule 5) — `next build` exercises exactly that path.
      - run: npm run build

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accounts/sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
